# ============================================================================
#  DeepSeek Harness 安全网关 —— 同端口 HTTP / HTTPS 双栈
#  对外端口不变：http://<IP>:3080  与  https://<IP>:3080  同时可用
#
#  分流原理：L4 层读取 ClientHello 首字节判断是否 TLS，
#            明文 → 明文业务端口；TLS → TLS 业务端口。客户端无需换端口。
# ============================================================================
# 加载发行版动态模块（Debian/Ubuntu 下提供 stream 模块）。若已静态编译可删掉此行。
include /etc/nginx/modules-enabled/*.conf;

worker_processes auto;
worker_rlimit_nofile 65535;
error_log  /etc/dsh-gateway/logs/error.log warn;
pid        /etc/dsh-gateway/run/nginx.pid;

events { worker_connections 4096; }

# ---------------------------------------------------------------------------
# L4：协议嗅探分流（端口保持 3080 不变）
# ---------------------------------------------------------------------------
stream {
    map $ssl_preread_protocol $dsh_backend {
        ""      127.0.0.1:13080;   # 未嗅到 TLS → 明文通道
        default 127.0.0.1:13443;     # 嗅到 TLS  → 加密通道
    }

    server {
        listen __BIND_ADDR__:3080;
        ssl_preread on;
        proxy_pass $dsh_backend;
        proxy_protocol on;              # 透传客户端真实 IP 给 L7
        proxy_connect_timeout 5s;
        proxy_timeout 1h;               # 兼容 WebSocket 长连接
    }
}

# ---------------------------------------------------------------------------
# L7：认证 / 加密 / 安全头
# ---------------------------------------------------------------------------
http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /etc/dsh-gateway/logs/access.log;
    server_tokens off;

    # 客户端真实 IP（由 L4 的 PROXY protocol 还原）
    set_real_ip_from 127.0.0.1;
    real_ip_header   proxy_protocol;

    # 登录爆破防护
    limit_req_zone $binary_remote_addr zone=dsh_login:10m rate=6r/m;
    limit_req_status 429;

    map $http_upgrade $connection_upgrade { default upgrade; "" close; }

    # --- 信任网段：直连放行，不做任何交互（这就是"不牺牲便利"）---
    geo $dsh_trusted {
        default 0;

    }

    # --- 非信任来源：Cookie（一次登录，30 天免密）或 Bearer Token ---
    map $cookie_dsh_sso   $dsh_by_cookie { "__GATEWAY_TOKEN__" 1; default 0; }
    map $http_authorization  $dsh_by_bearer { "Bearer __GATEWAY_TOKEN__" 1; default 0; }
    map "$dsh_trusted$dsh_by_cookie$dsh_by_bearer" $dsh_authorized {
        "000"   0;      # 三者皆不满足 → 拒绝
        default 1;
    }

    upstream dsh_app {
        server 127.0.0.1:3090;
        keepalive 32;
    }

    # =======================================================================
    # 明文通道：仅服务信任网段；其他来源原地 302 升级到同端口 HTTPS
    # =======================================================================
    server {
        listen 127.0.0.1:13080 proxy_protocol;
        server_name _;
        default_type text/html;          # 401 登录页需要按 HTML 渲染，避免被当成下载
        charset      utf-8;

        add_header X-Content-Type-Options nosniff   always;
        add_header X-Frame-Options        SAMEORIGIN always;
        add_header Referrer-Policy        no-referrer always;

        if ($dsh_trusted = 0) {
            return 302 https://$host:3080$request_uri;
        }

        location / {
            include /etc/dsh-gateway/conf/app_proxy.conf;
        }
    }

    # =======================================================================
    # 加密通道：全量放行（已认证来源），一次性登录入口 /__auth?k=<token>
    # =======================================================================
    server {
        listen 127.0.0.1:13443 ssl proxy_protocol http2;
        server_name _;
        default_type text/html;          # 401 登录页需要按 HTML 渲染，避免被当成下载
        charset      utf-8;

        ssl_certificate     /etc/dsh-gateway/certs/fullchain.pem;
        ssl_certificate_key /etc/dsh-gateway/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:DSHSSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options    nosniff always;
        add_header X-Frame-Options           SAMEORIGIN always;
        add_header Referrer-Policy           no-referrer always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # 一次性登录链接：/__auth?k=<token> → 下发 30 天 HttpOnly Cookie → 跳回首页
        # 注意：return 属 rewrite 阶段，会绕过 limit_req（preaccess 阶段）。
        # 这里用 try_files 把请求推进到 precontent 阶段，确保限速先生效。
        location = /__auth {
            limit_req zone=dsh_login burst=3 nodelay;
            try_files /__dsh_no_such_file__ @dsh_login;
        }

        location @dsh_login {
            access_log off;   # 令牌经查询串传入，禁止写入 access.log（防泄漏）
            default_type text/html;
            if ($arg_k = "__GATEWAY_TOKEN__") {
                add_header Set-Cookie "dsh_sso=__GATEWAY_TOKEN__; Path=/; Max-Age=2592000; HttpOnly; Secure; SameSite=Lax" always;
                # 必须显式带上对外端口，否则会把内部 TLS 端口暴露给浏览器
                return 302 https://$host:3080/;
            }
            return 401 "<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>需要访问令牌</title><style>body{background:#151517;color:#e6e9ef;margin:0;height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}form{background:#1c1f26;border:1px solid #2b3140;border-radius:14px;padding:28px 30px;width:330px;box-shadow:0 20px 60px rgba(0,0,0,.5)}h3{margin:0 0 8px;font-size:16px;font-weight:600}p{margin:0 0 18px;font-size:12.5px;line-height:1.7;color:#9aa4b2}input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:9px;border:1px solid #333a48;background:#12151b;color:#fff;font-size:14px;outline:none}input:focus{border-color:#4c8dff}button{margin-top:13px;width:100%;padding:11px;border:0;border-radius:9px;background:#4c8dff;color:#fff;font-size:14px;font-weight:500;cursor:pointer}button:hover{background:#3d7cf0}</style><form method=get action=/__auth><h3>需要访问令牌</h3><p>此工作台已开启访问保护。请输入管理员提供的令牌，验证通过后本机 30 天内免密。</p><input name=k placeholder='粘贴访问令牌' autofocus autocomplete=off><button type=submit>进入工作台</button></form>";
        }

        # 构建产物文件名带内容哈希（index-BXV-oxvX.js 这种），内容变了文件名就变，
        # 所以可以安全地长缓存一年。上游没发 Cache-Control，导致每次刷新都重下 530KB。
        location ^~ /assets/ {
            if ($dsh_authorized = 0) { return 401 "unauthorized"; }
            include /etc/dsh-gateway/conf/app_proxy.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
        }

        location / {
            if ($dsh_authorized = 0) { return 401 "<!doctype html><meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>需要访问令牌</title><style>body{background:#151517;color:#e6e9ef;margin:0;height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,'PingFang SC',sans-serif}form{background:#1c1f26;border:1px solid #2b3140;border-radius:14px;padding:28px 30px;width:330px;box-shadow:0 20px 60px rgba(0,0,0,.5)}h3{margin:0 0 8px;font-size:16px;font-weight:600}p{margin:0 0 18px;font-size:12.5px;line-height:1.7;color:#9aa4b2}input{width:100%;box-sizing:border-box;padding:11px 12px;border-radius:9px;border:1px solid #333a48;background:#12151b;color:#fff;font-size:14px;outline:none}input:focus{border-color:#4c8dff}button{margin-top:13px;width:100%;padding:11px;border:0;border-radius:9px;background:#4c8dff;color:#fff;font-size:14px;font-weight:500;cursor:pointer}button:hover{background:#3d7cf0}</style><form method=get action=/__auth><h3>需要访问令牌</h3><p>此工作台已开启访问保护。请输入管理员提供的令牌，验证通过后本机 30 天内免密。</p><input name=k placeholder='粘贴访问令牌' autofocus autocomplete=off><button type=submit>进入工作台</button></form>"; }
            include /etc/dsh-gateway/conf/app_proxy.conf;
        }
    }
}
